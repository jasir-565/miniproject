{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AutoNexa</title>

    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

    <div class="auth-wrapper">

        <div class="auth-card">

            <h1>AutoNexa</h1>

            <p>
                Create your customer account to book vehicle services and request roadside assistance.
            </p>

            {% if error %}
                <div class="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    required
                    placeholder="Choose a username"
                >

                <label for="first_name">
                    First Name
                </label>

                <input
                    type="text"
                    name="first_name"
                    id="first_name"
                    required
                    placeholder="Enter your first name"
                >

                <label for="last_name">
                    Last Name
                </label>

                <input
                    type="text"
                    name="last_name"
                    id="last_name"
                    placeholder="Enter your last name"
                >

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    required
                    placeholder="Enter your email address"
                >

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    id="phone"
                    required
                    placeholder="Enter your phone number"
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    required
                    placeholder="Create a password"
                >

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    required
                    placeholder="Confirm your password"
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p>
                Already have an account?
                <a href="{% url 'login' %}">
                    Login here
                </a>
            </p>

        </div>

    </div>

</body>
</html>
